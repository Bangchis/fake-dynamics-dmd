# Experiment plan, not a Config file for fdmd train. Use scripts/run_h100.sh.
base_config: configs/h100_2x80.yaml
seed: 10
screen_total_generator_updates_per_candidate: 300
candidates:
  cd-low: {consistency_weight_max: 0.03}
  cd-default: {consistency_weight_max: 0.1}
  cd-high: {consistency_weight_max: 0.3}
fixed: {teacher_anchor_beta_max: 0.05, generator_ema_decay: 0.99, generator_lr: 2.0e-6, fake_lr: 2.0e-6, target_global_batch_size: 128}
confirmation_total_generator_updates: 1500
main_total_generator_updates: 5000
# Baseline uses the SAME adapter/sampling, beta=0 and CD=0; not official DMD2 GAN training.
control: {beta_override: 0.0, consistency_override: 0.0, total_generator_updates: 1500}
control_main_total_generator_updates: 5000 # required for matched final-method comparison
selection: docs/H100_RUN_PLAN.md
