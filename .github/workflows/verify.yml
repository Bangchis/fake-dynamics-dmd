name: Recipient verification (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-unit-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Static checks
        run: |
          ruff check .
          ruff format --check .
      - name: Numerical, ownership, sampler and resume checks
        run: pytest -q
